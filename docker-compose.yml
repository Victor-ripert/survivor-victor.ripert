version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: profils-actifs-db
    environment:
      POSTGRES_USER: profils_user
      POSTGRES_PASSWORD: profils_password
      POSTGRES_DB: profils_actifs_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profils_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: profils-actifs-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@profils-actifs.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
