openapi: 3.0.0
info:
  title: ProfilsActifs API
  version: 1.0.0
  description: Plateforme JEB de valorisation des compétences
servers:
  - url: http://localhost:3000/api
    description: Development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [APPLICANT, RECRUITER, ADMIN]
      required: [id, email, role]

    Profile:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        headline:
          type: string
        bio:
          type: string
        location:
          type: string
        sector:
          type: string
        skills:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSkill'
        videos:
          type: array
          items:
            $ref: '#/components/schemas/Video'
        certificationStatus:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED, REJECTED]
        certificationScore:
          type: integer
          minimum: 0
          maximum: 100
        certificationBadge:
          type: string
        moderationStatus:
          type: string
          description: >-
            Set by an admin via the moderation endpoints, never by the
            profile's owner. Only an `APPROVED` profile appears in the
            public feed (`GET /profiles`); a `PENDING`/`REJECTED` one is
            still visible at `GET /profiles/{id}` to its own owner.
          enum: [PENDING, APPROVED, REJECTED]
      required: [id, userId, location, sector, certificationStatus, moderationStatus]

    Video:
      type: object
      properties:
        id:
          type: string
        profileId:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [EXTERNAL_LINK, UPLOAD]
        url:
          type: string
        duration:
          type: integer
        moderationStatus:
          type: string
          description: >-
            Same purpose as `Profile.moderationStatus` — set by an admin via
            the video-moderation endpoints. A profile being `APPROVED` does
            not by itself approve its individual videos; each video carries
            its own moderation state.
          enum: [PENDING, APPROVED, REJECTED]
      required: [id, profileId, title, type, url, moderationStatus]

    ProfileSkill:
      type: object
      properties:
        id:
          type: string
        skillId:
          type: string
        skillName:
          type: string
        level:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED, EXPERT]
      required: [id, skillId, level]

    CertificationQuestion:
      type: object
      properties:
        id:
          type: string
        order:
          type: integer
        type:
          type: string
          enum: [MULTIPLE_CHOICE, SHORT_TEXT, CHECKBOX, LIKERT_SCALE]
        text:
          type: string
        description:
          type: string
        weight:
          type: integer
        maxPoints:
          type: integer
        options:
          type: array
          items:
            $ref: '#/components/schemas/CertificationOption'
      required: [id, order, type, text]

    CertificationOption:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        points:
          type: integer
        order:
          type: integer
      required: [id, text, order]

    CertificationAttempt:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED, ABANDONED, EXPIRED]
        score:
          type: integer
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
      required: [id, userId, status, startedAt]

    Answer:
      type: object
      properties:
        id:
          type: string
        attemptId:
          type: string
        questionId:
          type: string
        optionId:
          type: string
        textAnswer:
          type: string
        numericAnswer:
          type: integer
        pointsEarned:
          type: integer
      required: [id, attemptId, questionId]

    Interaction:
      type: object
      properties:
        id:
          type: string
        recipientId:
          type: string
        createdById:
          type: string
        type:
          type: string
          enum: [VIEW, CONTACT, FAVORITE, MESSAGE]
        message:
          type: string
        isViewed:
          type: boolean
        isFavorite:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, recipientId, createdById, type, createdAt]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        statusCode:
          type: integer

  # ==========================================================================
  # Reusable error-response examples. Every non-2xx response in this file is
  # `{ error, message, statusCode }` (see CLAUDE.md's "Uniform error shape"),
  # so the concrete example bodies live once here and get referenced by
  # `$ref` from each path's `responses` block, instead of the same JSON
  # being retyped at every route that can fail the same way.
  # ==========================================================================
  examples:
    ValidationError:
      summary: A request body or query param failed validation
      value:
        error: validation_error
        message: Localisation requise
        statusCode: 400
    Unauthorized:
      summary: No token, or an invalid/expired one
      value:
        error: unauthorized
        message: No token provided
        statusCode: 401
    ForbiddenRole:
      summary: A valid token, but the wrong role for this route
      value:
        error: forbidden
        message: Insufficient permissions
        statusCode: 403
    ProfileNotFound:
      summary: No profile matches the given id
      value:
        error: not_found
        message: Profile not found
        statusCode: 404
    VideoNotFound:
      summary: No video matches the given id (or it belongs to someone else's profile)
      value:
        error: not_found
        message: Video not found
        statusCode: 404
    SkillNotFound:
      summary: Skill not tagged on this profile
      value:
        error: not_found
        message: Skill not found on this profile
        statusCode: 404
    UnrecognizedVideoFile:
      summary: An UPLOAD file's actual content isn't a recognized video format
      value:
        error: unprocessable_entity
        message: >-
          This file is not a recognized video format (mp4, webm, mov).
          Renaming a file to a video extension doesn't make it one.
        statusCode: 422
    UploadTooLarge:
      summary: An UPLOAD file exceeds the 100MB server-side cap
      value:
        error: payload_too_large
        message: Video files can't exceed 100MB.
        statusCode: 413

security:
  - bearerAuth: []

paths:
  # ==========================================================================
  # AUTHENTICATION (Domain A)
  # ==========================================================================

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                firstName:
                  type: string
                lastName:
                  type: string
                role:
                  type: string
                  enum: [APPLICANT, RECRUITER, ADMIN]
              required: [email, password, firstName, lastName, role]
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  # ==========================================================================
  # PROFILES (Domain B)
  # ==========================================================================

  /profiles:
    get:
      tags: [Profiles]
      summary: List all profiles (paginated, public)
      description: Only `APPROVED` profiles are ever returned here — see `Profile.moderationStatus`.
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 20
            description: Capped at 20 server-side regardless of the value requested.
        - name: sector
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: certificationStatus
          in: query
          schema:
            type: string
            enum: [PENDING, IN_PROGRESS, COMPLETED, REJECTED]
      responses:
        '200':
          description: List of profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer
        '400':
          description: Invalid query parameter (e.g. an unrecognized `certificationStatus`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  $ref: '#/components/examples/ValidationError'

  /profiles/{id}:
    get:
      tags: [Profiles]
      summary: Get profile by ID (public)
      description: >-
        Public, but the profile's own owner (if authenticated) can also see
        it while it's still `PENDING`/`REJECTED` — a stranger gets the same
        404 as a genuinely nonexistent id, either way, so this endpoint
        never reveals that an unapproved profile exists.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: >-
            No profile with this id, or one exists but isn't `APPROVED` and
            the caller isn't its owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  $ref: '#/components/examples/ProfileNotFound'

  /profiles/me:
    get:
      tags: [Profiles]
      summary: Get my profile (applicant only)
      responses:
        '200':
          description: My profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `APPLICANT`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'
        '404':
          description: This applicant hasn't created a profile yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  $ref: '#/components/examples/ProfileNotFound'

    post:
      tags: [Profiles]
      summary: Create or update my profile (applicant only)
      description: >-
        Upsert: creates the profile on first call, updates it on every call
        after. A field omitted from the body leaves its existing value
        untouched rather than clearing it. `moderationStatus` and
        `certificationStatus` are never accepted here — both are
        server-controlled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                headline:
                  type: string
                  maxLength: 120
                bio:
                  type: string
                  maxLength: 2000
                location:
                  type: string
                sector:
                  type: string
              required: [location, sector]
      responses:
        '200':
          description: Profile created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Missing/invalid field (e.g. `location` absent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  $ref: '#/components/examples/ValidationError'
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `APPLICANT`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'

  /profiles/me/skills:
    post:
      tags: [Profiles]
      summary: Tag a skill on my profile (applicant only)
      description: >-
        Upsert, like `POST /profiles/me`: tagging a skill that's already on
        the profile updates its `level` rather than erroring or duplicating
        the entry (`ProfileSkill` is uniquely keyed on `profileId`+`skillId`
        — see `schema.prisma`). `skillName` is looked up (or created) in the
        shared `Skill` catalog by name; the client never supplies a
        `skillId` directly. Not yet implemented server-side — tracked as a
        follow-up to this contract change, same as the video-moderation
        endpoints below.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skillName:
                  type: string
                level:
                  type: string
                  enum: [BEGINNER, INTERMEDIATE, ADVANCED, EXPERT]
                  default: INTERMEDIATE
              required: [skillName]
      responses:
        '200':
          description: Skill tagged (or its level updated) — the full updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Missing/invalid field (e.g. empty `skillName`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  $ref: '#/components/examples/ValidationError'
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `APPLICANT`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'
        '404':
          description: This applicant hasn't created a profile yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  $ref: '#/components/examples/ProfileNotFound'

  /profiles/me/skills/{skillId}:
    delete:
      tags: [Profiles]
      summary: Remove a skill from my profile (applicant only)
      description: >-
        `skillId` identifies the shared `Skill` catalog entry (the same id
        `POST /profiles/me/skills` resolved `skillName` to), not the
        `ProfileSkill` join row. Not yet implemented server-side — see the
        note on `POST /profiles/me/skills`.
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Skill removed from the profile
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `APPLICANT`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'
        '404':
          description: This skill isn't tagged on the caller's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  $ref: '#/components/examples/SkillNotFound'

  # ==========================================================================
  # VIDEOS (Domain B)
  # ==========================================================================

  /profiles/{profileId}/videos:
    get:
      tags: [Videos]
      summary: Get videos for a profile
      description: >-
        Public, but returns an empty array uniformly for a nonexistent
        profile, a profile the caller can't see (not `APPROVED`, not its
        owner), and a profile with no videos — never a 404 — so this
        endpoint doesn't leak which of those three is actually true.
      security: []
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of videos (possibly empty — see description)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Video'

    post:
      tags: [Videos]
      summary: Add video to profile (applicant only)
      description: >-
        `EXTERNAL_LINK` (YouTube/Vimeo) is fully supported. `UPLOAD`
        currently responds `501 not_implemented` — the size/content-type
        checks below are implemented in `video.service.ts` and covered by
        tests, but no route parses a real multipart upload into them yet
        (needs `multer`, not currently a dependency). The `422`/`413`
        responses describe the contract once that lands, not current
        reachable behavior.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 120
                description:
                  type: string
                  maxLength: 500
                type:
                  type: string
                  enum: [EXTERNAL_LINK, UPLOAD]
                url:
                  type: string
                  format: uri
                duration:
                  type: integer
                  description: Seconds
              required: [title, type, url]
      responses:
        '201':
          description: Video created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          description: Missing/invalid field, or a malformed/non-YouTube/Vimeo `url`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  $ref: '#/components/examples/ValidationError'
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `APPLICANT`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'
        '404':
          description: No profile with this id, or it isn't the caller's own
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  $ref: '#/components/examples/ProfileNotFound'
        '413':
          description: '`type: UPLOAD` only, once wired up — file exceeds the 100MB cap'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                uploadTooLarge:
                  $ref: '#/components/examples/UploadTooLarge'
        '422':
          description: >-
            `type: UPLOAD` only, once wired up — the file's actual content
            isn't a recognized video format, checked from the file's bytes,
            not its extension or client-supplied MIME type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unrecognizedVideoFile:
                  $ref: '#/components/examples/UnrecognizedVideoFile'
        '501':
          description: '`type: UPLOAD` — not implemented yet, use `EXTERNAL_LINK`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /videos/{videoId}:
    delete:
      tags: [Videos]
      summary: Delete video (applicant only)
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Video deleted
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `APPLICANT`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'
        '404':
          description: No video with this id, or it isn't on the caller's own profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  $ref: '#/components/examples/VideoNotFound'

  # ==========================================================================
  # CERTIFICATION (Domain C)
  # ==========================================================================

  /certification/questions:
    get:
      tags: [Certification]
      summary: Get all certification questions (public)
      security: []
      responses:
        '200':
          description: List of questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificationQuestion'

    post:
      tags: [Certification]
      summary: Create certification question (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: integer
                type:
                  type: string
                  enum: [MULTIPLE_CHOICE, SHORT_TEXT, CHECKBOX, LIKERT_SCALE]
                text:
                  type: string
                description:
                  type: string
                weight:
                  type: integer
                maxPoints:
                  type: integer
                options:
                  type: array
                  items:
                    type: object
                    properties:
                      text:
                        type: string
                      points:
                        type: integer
              required: [order, type, text]
      responses:
        '201':
          description: Question created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationQuestion'

  /certification/attempt:
    post:
      tags: [Certification]
      summary: Start certification attempt (applicant only)
      responses:
        '201':
          description: Attempt created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationAttempt'

  /certification/attempt/{attemptId}:
    get:
      tags: [Certification]
      summary: Get certification attempt
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attempt details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationAttempt'

  /certification/attempt/{attemptId}/answer:
    post:
      tags: [Certification]
      summary: Submit answer to question (applicant only, can save in progress)
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                questionId:
                  type: string
                optionId:
                  type: string
                textAnswer:
                  type: string
                numericAnswer:
                  type: integer
              required: [questionId]
      responses:
        '201':
          description: Answer saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'

  /certification/attempt/{attemptId}/submit:
    post:
      tags: [Certification]
      summary: Submit certification attempt for scoring (applicant only)
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attempt submitted and scored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationAttempt'

  # ==========================================================================
  # INTERACTIONS & RECRUITER (Domain D)
  # ==========================================================================

  /interactions:
    get:
      tags: [Interactions]
      summary: Get my interactions (recruiter views sent, applicant views received)
      responses:
        '200':
          description: List of interactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: array
                    items:
                      $ref: '#/components/schemas/Interaction'
                  received:
                    type: array
                    items:
                      $ref: '#/components/schemas/Interaction'

  /interactions/{recipientId}:
    post:
      tags: [Interactions]
      summary: Create interaction with applicant (recruiter/admin)
      parameters:
        - name: recipientId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [VIEW, CONTACT, FAVORITE, MESSAGE]
                message:
                  type: string
              required: [type]
      responses:
        '201':
          description: Interaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'

  /interactions/{interactionId}:
    patch:
      tags: [Interactions]
      summary: Update interaction (mark as viewed, favorite, etc)
      parameters:
        - name: interactionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isViewed:
                  type: boolean
                isFavorite:
                  type: boolean
      responses:
        '200':
          description: Interaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'

  # ==========================================================================
  # NOTIFICATIONS (Domain A)
  # ==========================================================================

  /notifications:
    get:
      tags: [Notifications]
      summary: Get my notifications
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    type:
                      type: string
                    title:
                      type: string
                    message:
                      type: string
                    isRead:
                      type: boolean
                    createdAt:
                      type: string
                      format: date-time

  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked as read

  # ==========================================================================
  # ADMINISTRATION
  # ==========================================================================

  /admin/dashboard:
    get:
      tags: [Administration]
      summary: Get admin dashboard stats (admin only)
      responses:
        '200':
          description: Dashboard stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalProfiles:
                    type: integer
                  certificationRate:
                    type: number
                  totalInteractions:
                    type: integer
                  activeApplicants:
                    type: integer

  /admin/moderation/profiles:
    get:
      tags: [Administration]
      summary: Get profiles pending moderation (admin only)
      description: >-
        The review queue, oldest-submitted-first (the opposite order from
        the public feed) so nothing gets pushed down by newer submissions.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 20
      responses:
        '200':
          description: Paginated list of `PENDING` profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `ADMIN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'

  /admin/profiles/{profileId}/moderate:
    post:
      tags: [Administration]
      summary: Moderate a profile (admin only)
      description: >-
        Atomically updates `Profile.moderationStatus` and appends a
        `ModerationLog` row — see that model's mapping from `action` to the
        resulting status in `moderation.service.ts` (`REQUIRE_CHANGES` and
        `REJECT` both resolve to `REJECTED`; the distinction is preserved in
        the log's `action`, not in the status field itself).
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT, FLAG, REQUIRE_CHANGES]
                reason:
                  type: string
                  maxLength: 500
                notes:
                  type: string
                  maxLength: 2000
              required: [action]
      responses:
        '200':
          description: Profile moderated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Missing/invalid `action`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  $ref: '#/components/examples/ValidationError'
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `ADMIN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'
        '404':
          description: No profile with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  $ref: '#/components/examples/ProfileNotFound'

  /admin/moderation/videos:
    get:
      tags: [Administration]
      summary: Get videos pending moderation (admin only)
      description: >-
        Same shape and ordering as `GET /admin/moderation/profiles`, for
        `Video.moderationStatus` instead — a profile being `APPROVED`
        doesn't approve its individual videos, so this queue is reviewed
        separately. Not yet implemented server-side (tracked as a follow-up
        to this contract change): `moderation.service.ts`'s
        `applyModeration` already handles a `'video'` entity type
        generically, but nothing currently mirrors `listPendingProfiles` for
        videos or routes these two paths to a controller.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 20
      responses:
        '200':
          description: Paginated list of `PENDING` videos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Video'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `ADMIN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'

  /admin/videos/{videoId}/moderate:
    post:
      tags: [Administration]
      summary: Moderate a video (admin only)
      description: >-
        Same semantics as `POST /admin/profiles/{profileId}/moderate`, for
        `Video.moderationStatus`. Not yet implemented server-side — see the
        note on `GET /admin/moderation/videos`.
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT, FLAG, REQUIRE_CHANGES]
                reason:
                  type: string
                  maxLength: 500
                notes:
                  type: string
                  maxLength: 2000
              required: [action]
      responses:
        '200':
          description: Video moderated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Missing/invalid `action`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  $ref: '#/components/examples/ValidationError'
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `ADMIN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'
        '404':
          description: No video with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  $ref: '#/components/examples/VideoNotFound'
