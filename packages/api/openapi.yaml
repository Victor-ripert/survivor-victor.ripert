openapi: 3.0.0
info:
  title: ProfilsActifs API
  version: 1.0.0
  description: Plateforme JEB de valorisation des compétences
servers:
  - url: http://localhost:3000/api
    description: Development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      description: The authenticated account. Never carries the password hash.
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [APPLICANT, RECRUITER, ADMIN]
        birthDate:
          type: string
          format: date
          nullable: true
          description: Only ever set for job-seekers (brief §7.9.1); null for recruiters and admins.
      required: [id, email, firstName, lastName, role, birthDate]

    Profile:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        headline:
          type: string
        bio:
          type: string
        location:
          type: string
        sector:
          type: string
        skills:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSkill'
        videos:
          type: array
          items:
            $ref: '#/components/schemas/Video'
        certificationStatus:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED, REJECTED]
        certificationScore:
          type: integer
          minimum: 0
          maximum: 100
        certificationBadge:
          type: string
        availability:
          type: string
          description: >-
            Availability the candidate declared. Absent when they declared
            none, which `sort=availability` ranks last: "not stated" is not
            "available immediately". The enum is ordered soonest-first, and
            that order is the ordering `sort=availability` applies.
          enum: [IMMEDIATE, WITHIN_ONE_MONTH, WITHIN_THREE_MONTHS, LATER]
        moderationStatus:
          type: string
          description: >-
            Set by an admin via the moderation endpoints, never by the
            profile's owner. Only an `APPROVED` profile appears in the
            public feed (`GET /profiles`); a `PENDING`/`REJECTED` one is
            still visible at `GET /profiles/{id}` to its own owner.
          enum: [PENDING, APPROVED, REJECTED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        [
          id,
          userId,
          firstName,
          lastName,
          location,
          sector,
          skills,
          videos,
          certificationStatus,
          moderationStatus,
          createdAt,
          updatedAt,
        ]

    Video:
      type: object
      properties:
        id:
          type: string
        profileId:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [EXTERNAL_LINK, UPLOAD]
        url:
          type: string
        captionsUrl:
          type: string
          description: >-
            Address of the WebVTT caption track, served by this API under
            `/uploads/`. Present for `UPLOAD` videos that carry subtitles and
            absent otherwise — an `EXTERNAL_LINK` can never have one, since a
            track cannot be attached to YouTube's or Vimeo's player from
            outside it. Subtitles are an accessibility obligation, so a video
            served by ProfilsActifs itself is expected to carry this.
        duration:
          type: integer
        moderationStatus:
          type: string
          description: >-
            Same purpose as `Profile.moderationStatus` — set by an admin via
            the video-moderation endpoints. A profile being `APPROVED` does
            not by itself approve its individual videos; each video carries
            its own moderation state.
          enum: [PENDING, APPROVED, REJECTED]
        moderationReason:
          type: string
          description: >-
            The reason recorded with the refusal, present only when the video is
            `REJECTED` and only on the owner's own view (`GET /profiles/me`,
            `GET /profiles/{id}` as the owner) — brief §7.9.2 surfaces it to the
            candidate.
        createdAt:
          type: string
          format: date-time
        providerStatus:
          type: string
          description: >-
            Current availability of the provider serving the video. This is
            independent from moderationStatus: an approved video can be
            temporarily unavailable when its configured provider is degraded.
          enum: [ready, processing, unavailable]
      required: [id, profileId, title, type, url, providerStatus, moderationStatus, createdAt]

    ProfileSkill:
      type: object
      properties:
        id:
          type: string
        skillId:
          type: string
        skillName:
          type: string
        level:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED, EXPERT]
      required: [id, skillId, level]

    # Candidate-facing shape — never carries `points`/`weight`/`maxPoints`, or
    # the scoring barème leaks to whoever opens the browser network tab.
    CertificationQuestionPublic:
      type: object
      properties:
        id:
          type: string
        order:
          type: integer
        type:
          type: string
          enum: [MULTIPLE_CHOICE, SHORT_TEXT, CHECKBOX, LIKERT_SCALE]
        text:
          type: string
        description:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/CertificationOptionPublic'
      required: [id, order, type, text]

    CertificationOptionPublic:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        order:
          type: integer
      required: [id, text, order]

    # Admin-facing shape — full detail, used by the back-office question editor.
    CertificationQuestion:
      type: object
      properties:
        id:
          type: string
        order:
          type: integer
        type:
          type: string
          enum: [MULTIPLE_CHOICE, SHORT_TEXT, CHECKBOX, LIKERT_SCALE]
        text:
          type: string
        description:
          type: string
        weight:
          type: integer
        maxPoints:
          type: integer
        isActive:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/CertificationOption'
      required: [id, order, type, text, weight, maxPoints, isActive]

    CertificationOption:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        points:
          type: integer
        order:
          type: integer
      required: [id, text, points, order]

    CertificationAttempt:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED, ABANDONED, EXPIRED]
        score:
          type: integer
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
      # `answers` is always present, empty array included: the questionnaire
      # restores a resumed session from it.
      required: [id, userId, status, startedAt, answers]

    Answer:
      type: object
      properties:
        id:
          type: string
        attemptId:
          type: string
        questionId:
          type: string
        optionId:
          type: string
        textAnswer:
          type: string
        numericAnswer:
          type: integer
        pointsEarned:
          type: integer
      required: [id, attemptId, questionId]

    CertificationLevel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        minScore:
          type: integer
        maxScore:
          type: integer
        badgeIconUrl:
          type: string
          nullable: true
          description: null for the lowest tier — that's what marks it as "no badge earned"
        order:
          type: integer
      required: [id, name, minScore, maxScore, order]

    CertificationSubmitResult:
      type: object
      properties:
        attempt:
          $ref: '#/components/schemas/CertificationAttempt'
        score:
          type: integer
          minimum: 0
          maximum: 100
        badge:
          $ref: '#/components/schemas/CertificationLevel'
      required: [attempt, score, badge]

    Interaction:
      type: object
      properties:
        id:
          type: string
        recipientId:
          type: string
        createdById:
          type: string
        type:
          type: string
          enum: [VIEW, CONTACT, FAVORITE, MESSAGE]
        message:
          type: string
          nullable: true
        isViewed:
          type: boolean
        isFavorite:
          type: boolean
        createdAt:
          type: string
          format: date-time
        counterpart:
          $ref: '#/components/schemas/InteractionCounterpart'
      required: [id, recipientId, createdById, type, createdAt, counterpart]

    HealthStatus:
      type: object
      description: >-
        Answered by /health. `status` is `ok` (200) or `degraded` (503) — the
        probe reports the database's real state rather than the fact that the
        process is running.
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: The API package's version, read from its manifest
        environment:
          type: string
          enum: [development, test, production]
        uptimeSeconds:
          type: integer
        database:
          type: object
          properties:
            status:
              type: string
              enum: [up, down]
            latencyMs:
              type: integer
              description: Present only when the database answered
          required: [status]
      required: [status, version, environment, uptimeSeconds, database]

    VideoModerationItem:
      type: object
      description: One row of the video moderation queue.
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
          enum: [EXTERNAL_LINK, UPLOAD]
          description: >-
            Tells the player whether `url` is a YouTube/Vimeo embed or a file
            served by this API under `/uploads/`.
        url:
          type: string
          description: >-
            Disclosed on this admin-only route even while the video is PENDING,
            because moderating it means watching it. Never present on any
            recruiter- or public-facing response.
        captionsUrl:
          type: string
          nullable: true
          description: >-
            WebVTT caption track of an `UPLOAD` video, so the administrator
            reviews it as it will be published. `null` for an `EXTERNAL_LINK`,
            and for an upload without subtitles.
        durationSeconds:
          type: integer
          nullable: true
        moderationStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        submittedAt:
          type: string
          format: date-time
        applicant:
          type: object
          properties:
            profileId:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            headline:
              type: string
              nullable: true
          required: [profileId, firstName, lastName]
        lastDecision:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/VideoModerationDecision'
      required: [id, title, type, url, captionsUrl, moderationStatus, submittedAt, applicant]

    VideoModerationDecision:
      type: object
      properties:
        action:
          type: string
          enum: [APPROVE, REJECT]
        reason:
          type: string
        decidedAt:
          type: string
          format: date-time
        decidedBy:
          type: object
          properties:
            id:
              type: string
            firstName:
              type: string
            lastName:
              type: string
          required: [id, firstName, lastName]
      required: [action, reason, decidedAt, decidedBy]

    ErrorResponse:
      type: object
      description: >-
        The single error shape every non-2xx response uses. `error` is the
        snake_case code the frontend branches on — the complete set is the
        `ApiErrorCode` union in @profils-actifs/shared, mirrored by the enum
        below. `validation_error` (400) and `unprocessable_entity` (422) split
        on interpretability: 400 is decided by reading the request alone
        (malformed JSON, wrong shape, out-of-range primitive), 422 needs a
        database read — the payload is well formed but contradicts the state or
        the type of the resource it targets.
      properties:
        error:
          type: string
          enum:
            - validation_error
            - unauthorized
            - forbidden
            - not_found
            - unprocessable_entity
            - conflict
            - too_many_requests
            - payload_too_large
            - not_implemented
            - internal_error
            - service_unavailable
        message:
          type: string
        statusCode:
          type: integer
      required: [error, message, statusCode]

    PaginationMeta:
      type: object
      description: '`pages` is 0 when nothing matched, so "no result" reads differently from "one page of results".'
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer
      required: [page, limit, total, pages]

    CatalogueSkill:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        level:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED, EXPERT]
      required: [id, name, level]

    CataloguePreviewVideo:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [EXTERNAL_LINK, UPLOAD]
          description: >-
            Tells the player whether `url` is a YouTube/Vimeo embed or a file
            served by this API under `/uploads/`.
        url:
          type: string
        captionsUrl:
          type: string
          description: >-
            WebVTT caption track of an `UPLOAD` video, served under `/uploads/`.
            Absent for an `EXTERNAL_LINK`, and for an upload without subtitles.
      required: [id, title, type, url]

    CatalogueProfile:
      type: object
      description: One catalogue row, seen through the eyes of the calling recruiter.
      properties:
        id:
          type: string
        userId:
          type: string
          description: Target of POST /interactions and of the favourites routes.
        firstName:
          type: string
        lastName:
          type: string
        headline:
          type: string
          nullable: true
        location:
          type: string
        sector:
          type: string
        certificationStatus:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED, REJECTED]
        certificationScore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        certificationBadge:
          type: string
          nullable: true
        availability:
          type: string
          nullable: true
          description: >-
            Availability the candidate declared. Absent when they declared
            none, which `sort=availability` ranks last: "not stated" is not
            "available immediately". The enum is ordered soonest-first, and
            that order is the ordering `sort=availability` applies.
          enum: [IMMEDIATE, WITHIN_ONE_MONTH, WITHIN_THREE_MONTHS, LATER]
        skills:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueSkill'
        videoCount:
          type: integer
        previewVideo:
          allOf:
            - $ref: '#/components/schemas/CataloguePreviewVideo'
          nullable: true
        isFavorite:
          type: boolean
          description: Whether the calling recruiter shortlisted this applicant.
        lastContactedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
      required:
        [
          id,
          userId,
          firstName,
          lastName,
          location,
          sector,
          certificationStatus,
          skills,
          videoCount,
          isFavorite,
          updatedAt,
        ]

    CatalogueProfilePage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueProfile'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required: [data, pagination]

    FacetValue:
      type: object
      properties:
        value:
          type: string
        count:
          type: integer
      required: [value, count]

    CatalogueFacets:
      type: object
      properties:
        sectors:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
        availabilities:
          type: array
          description: >-
            Declared availabilities that match at least one visible profile,
            in enum order rather than by count — this list is a scale, and
            ranking it by popularity would misread it. Profiles that declared
            none are not a value here; they are the remainder.
          items:
            $ref: '#/components/schemas/FacetValue'
      required: [sectors, locations, skills, availabilities]

    InteractionCounterpart:
      type: object
      description: The other party, from the point of view of the caller.
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [APPLICANT, RECRUITER, ADMIN]
        profileId:
          type: string
          nullable: true
      required: [id, firstName, lastName, role]

    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [NEW_INTERACTION_RECEIVED, CERTIFICATION_BADGE_EARNED]
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        interactionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, type, title, message, isRead, createdAt]

    NotificationPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required: [data, pagination]

    InteractionPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Interaction'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required: [data, pagination]

    DailyCount:
      type: object
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
      required: [date, count]

    LabelledCount:
      type: object
      properties:
        label:
          type: string
        count:
          type: integer
      required: [label, count]

    RecruiterDashboard:
      type: object
      properties:
        totals:
          type: object
          properties:
            profilesViewed:
              type: integer
              description: Distinct applicants viewed, not page loads.
            contactsSent:
              type: integer
            favorites:
              type: integer
            applicantsReached:
              type: integer
          required: [profilesViewed, contactsSent, favorites, applicantsReached]
        certifiedShare:
          type: number
          minimum: 0
          maximum: 1
          description: Share of contacted applicants holding a completed certification.
        activityLast30Days:
          type: array
          items:
            $ref: '#/components/schemas/DailyCount'
        interactionsByType:
          type: array
          items:
            $ref: '#/components/schemas/LabelledCount'
        topSectorsReached:
          type: array
          items:
            $ref: '#/components/schemas/LabelledCount'
        recentContacts:
          type: array
          items:
            $ref: '#/components/schemas/Interaction'
      required:
        [
          totals,
          certifiedShare,
          activityLast30Days,
          interactionsByType,
          topSectorsReached,
          recentContacts,
        ]

    AdminDashboard:
      type: object
      properties:
        totals:
          type: object
          properties:
            totalProfiles:
              type: integer
            activeApplicants:
              type: integer
            totalRecruiters:
              type: integer
            totalInteractions:
              type: integer
            pendingModeration:
              type: integer
          required:
            [totalProfiles, activeApplicants, totalRecruiters, totalInteractions, pendingModeration]
        certificationRate:
          type: number
          minimum: 0
          maximum: 1
        usersByRole:
          type: array
          items:
            $ref: '#/components/schemas/LabelledCount'
        profilesByCertificationStatus:
          type: array
          items:
            $ref: '#/components/schemas/LabelledCount'
        interactionsByType:
          type: array
          items:
            $ref: '#/components/schemas/LabelledCount'
        topSectors:
          type: array
          items:
            $ref: '#/components/schemas/LabelledCount'
        signupsLast30Days:
          type: array
          items:
            $ref: '#/components/schemas/DailyCount'
        interactionsLast30Days:
          type: array
          items:
            $ref: '#/components/schemas/DailyCount'
      required:
        [
          totals,
          certificationRate,
          usersByRole,
          profilesByCertificationStatus,
          interactionsByType,
          topSectors,
          signupsLast30Days,
          interactionsLast30Days,
        ]

  parameters:
    PageParam:
      name: page
      in: query
      description: 1-based page number. A page beyond the last one returns an empty list, not an error.
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Page size, capped server-side at 20.
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 20

  responses:
    BadRequest:
      description: The request failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The caller's role does not allow this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: >-
        The payload parsed and matched its schema, but contradicts the resource
        it targets — the mismatch is only detectable against database state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit reached
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: >-
        A dependency the API needs is not answering — the database refused the
        connection, or its pool timed out. The request is worth retrying; any
        endpoint can answer this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # Reusable error-response *examples* — concrete illustrative bodies, used
  # alongside (not instead of) the `responses:` block above: `responses.*`
  # gives a path a whole ready-made response object to `$ref`, `examples.*`
  # gives a concrete JSON payload to show under a response's schema. Every
  # non-2xx response in this file is `{ error, message, statusCode }` (see
  # CLAUDE.md's "Uniform error shape"), so the concrete example bodies live
  # once here and get referenced by `$ref` from each path's `responses`
  # block, instead of the same JSON being retyped at every route that can
  # fail the same way.
  # ==========================================================================
  examples:
    ValidationError:
      summary: A request body or query param failed validation
      value:
        error: validation_error
        message: Localisation requise
        statusCode: 400
    Unauthorized:
      summary: No token, or an invalid/expired one
      value:
        error: unauthorized
        message: No token provided
        statusCode: 401
    ForbiddenRole:
      summary: A valid token, but the wrong role for this route
      value:
        error: forbidden
        message: Insufficient permissions
        statusCode: 403
    ProfileNotFound:
      summary: No profile matches the given id
      value:
        error: not_found
        message: Profile not found
        statusCode: 404
    VideoNotFound:
      summary: No video matches the given id (or it belongs to someone else's profile)
      value:
        error: not_found
        message: Video not found
        statusCode: 404
    SkillNotFound:
      summary: Skill not tagged on this profile
      value:
        error: not_found
        message: Skill not found on this profile
        statusCode: 404
    UnrecognizedVideoFile:
      summary: An UPLOAD file's actual content isn't a recognized video format
      value:
        error: unprocessable_entity
        message: >-
          This file is not a recognized video format (mp4, webm, mov).
          Renaming a file to a video extension doesn't make it one.
        statusCode: 422
    UploadTooLarge:
      summary: An UPLOAD file exceeds the 100MB server-side cap
      value:
        error: payload_too_large
        message: Video files can't exceed 100MB.
        statusCode: 413

security:
  - bearerAuth: []

paths:
  # ==========================================================================
  # SYSTEM
  # ==========================================================================

  /health:
    get:
      tags: [System]
      summary: Liveness and database-connectivity probe
      description: >-
        Mounted ahead of the rate limiter, so a probe running on a timer never
        consumes a caller's request budget. It runs a real `SELECT 1` — an API
        whose database is unreachable answers 503 and is taken out of rotation
        instead of serving errors (§8.2).
      security: []
      responses:
        '200':
          description: The process answers and the database accepted a query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: The database is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  # ==========================================================================
  # AUTHENTICATION (Domain A)
  # ==========================================================================

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                firstName:
                  type: string
                lastName:
                  type: string
                role:
                  type: string
                  # ADMIN is deliberately not self-assignable: this endpoint is
                  # unauthenticated, so accepting it would let anyone mint an
                  # administrator. Admin accounts come from the seed.
                  enum: [APPLICANT, RECRUITER]
                birthDate:
                  type: string
                  format: date
                  description: >-
                    Required when `role` is `APPLICANT`, and must be at least
                    16 years ago (brief §7.9.1: strict block below 16). Not
                    accepted for a `RECRUITER`, who is never asked for it.
              required: [email, password, firstName, lastName, role]
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
        '400':
          description: Validation error, including a job-seeker under 16
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  # ==========================================================================
  # PROFILES (Domain B)
  # ==========================================================================

  /profiles:
    get:
      tags: [Profiles]
      summary: The public feed (paginated, no account needed)
      description: >-
        Approved profiles of active adult job-seekers, newest first, each with
        its approved videos only (brief §7.9.1 and §7.9.2). Deliberately
        carries no filter: the feed is browsable without an account and exposes
        no selection criterion — filtering lives in the role-gated recruiter
        catalogue (docs/livrables/note-criteres-de-filtrage.md).
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A page of profiles; an out-of-range page answers an empty `data`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, pagination]
        '400':
          $ref: '#/components/responses/BadRequest'

  /profiles/{id}:
    get:
      tags: [Profiles]
      summary: Get profile by ID (public)
      description: >-
        Public, but the profile's own owner (if authenticated) can also see
        it while it's still `PENDING`/`REJECTED`, with every video whatever
        its moderation state. Anyone else only gets an approved profile held
        by an adult, with its approved videos — a stranger gets the same 404
        for a pending profile, a minor's profile and a nonexistent id, so this
        endpoint never reveals that a hidden profile exists.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: >-
            No profile with this id, or one exists but isn't `APPROVED` and
            the caller isn't its owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  $ref: '#/components/examples/ProfileNotFound'

  /profiles/me:
    get:
      tags: [Profiles]
      summary: Get my profile (applicant only)
      responses:
        '200':
          description: My profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `APPLICANT`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'
        '404':
          description: This applicant hasn't created a profile yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  $ref: '#/components/examples/ProfileNotFound'

    post:
      tags: [Profiles]
      summary: Create or update my profile (applicant only)
      description: >-
        Upsert: creates the profile on first call, updates it on every call
        after. A field omitted from the body leaves its existing value
        untouched rather than clearing it. `moderationStatus` and
        `certificationStatus` are never accepted here — both are
        server-controlled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                headline:
                  type: string
                  maxLength: 120
                bio:
                  type: string
                  maxLength: 2000
                location:
                  type: string
                sector:
                  type: string
                availability:
                  type: string
                  nullable: true
                  description: >-
                    Sending `null` clears a previously declared availability;
                    omitting the key leaves the stored value untouched.
                  enum: [IMMEDIATE, WITHIN_ONE_MONTH, WITHIN_THREE_MONTHS, LATER]
              required: [location, sector]
      responses:
        '200':
          description: Profile created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Missing/invalid field (e.g. `location` absent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  $ref: '#/components/examples/ValidationError'
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `APPLICANT`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'

  /profiles/me/skills:
    post:
      tags: [Profiles]
      summary: Tag a skill on my profile (applicant only)
      description: >-
        Upsert, like `POST /profiles/me`: tagging a skill that's already on
        the profile updates its `level` rather than erroring or duplicating
        the entry (`ProfileSkill` is uniquely keyed on `profileId`+`skillId`
        — see `schema.prisma`). `skillName` is looked up (or created) in the
        shared `Skill` catalog by name; the client never supplies a
        `skillId` directly; names are matched case-insensitively so "react"
        and "React" tag the same entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skillName:
                  type: string
                level:
                  type: string
                  enum: [BEGINNER, INTERMEDIATE, ADVANCED, EXPERT]
                  default: INTERMEDIATE
              required: [skillName]
      responses:
        '200':
          description: Skill tagged (or its level updated) — the full updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Missing/invalid field (e.g. empty `skillName`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  $ref: '#/components/examples/ValidationError'
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `APPLICANT`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'
        '404':
          description: This applicant hasn't created a profile yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  $ref: '#/components/examples/ProfileNotFound'

  /profiles/me/skills/{skillId}:
    delete:
      tags: [Profiles]
      summary: Remove a skill from my profile (applicant only)
      description: >-
        `skillId` identifies the shared `Skill` catalog entry (the same id
        `POST /profiles/me/skills` resolved `skillName` to), not the
        `ProfileSkill` join row.
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Skill removed from the profile
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `APPLICANT`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'
        '404':
          description: This skill isn't tagged on the caller's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  $ref: '#/components/examples/SkillNotFound'

  /skills:
    get:
      tags: [Profiles]
      summary: The shared skill catalog (public)
      description: Names only, for the profile form's suggestions — nothing about who holds them.
      security: []
      responses:
        '200':
          description: Every skill, alphabetically
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                  required: [id, name]

  # ==========================================================================
  # VIDEOS (Domain B)
  # ==========================================================================

  /profiles/{profileId}/videos:
    get:
      tags: [Videos]
      summary: Get videos for a profile
      description: >-
        Public, but returns an empty array uniformly for a nonexistent
        profile, a profile the caller can't see (not `APPROVED`, not its
        owner), and a profile with no videos — never a 404 — so this
        endpoint doesn't leak which of those three is actually true.
      security: []
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of videos (possibly empty — see description)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Video'

    post:
      tags: [Videos]
      summary: Add video to profile (applicant only)
      description: >-
        `EXTERNAL_LINK` (YouTube/Vimeo) is the shipped path: the link is
        normalised to its embed form and the new video is `PENDING` until an
        administrator approves it (brief §7.9.2). Publishing is the consent act
        of brief §7.1 — `consentAccepted` must be `true`, and the API logs the
        moment and the version of the consent text with the video. `UPLOAD`
        answers `501 not_implemented`: the size and content-type checks exist
        in `video.service.ts`, but no route parses a multipart body yet; the
        `413`/`422` responses describe the contract once that lands.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 120
                description:
                  type: string
                  maxLength: 500
                type:
                  type: string
                  enum: [EXTERNAL_LINK, UPLOAD]
                url:
                  type: string
                  format: uri
                duration:
                  type: integer
                  description: Seconds
                consentAccepted:
                  type: boolean
                  enum: [true]
                  description: The candidate accepted the consent text (`VIDEO_CONSENT_TEXT` in @profils-actifs/shared).
              required: [title, type, url, consentAccepted]
      responses:
        '201':
          description: Video created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          description: Missing/invalid field, or a malformed/non-YouTube/Vimeo `url`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  $ref: '#/components/examples/ValidationError'
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `APPLICANT`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'
        '404':
          description: No profile with this id, or it isn't the caller's own
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  $ref: '#/components/examples/ProfileNotFound'
        '413':
          description: '`type: UPLOAD` only, once wired up — file exceeds the 100MB cap'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                uploadTooLarge:
                  $ref: '#/components/examples/UploadTooLarge'
        '422':
          description: >-
            `type: UPLOAD` only, once wired up — the file's actual content
            isn't a recognized video format, checked from the file's bytes,
            not its extension or client-supplied MIME type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unrecognizedVideoFile:
                  $ref: '#/components/examples/UnrecognizedVideoFile'
        '501':
          description: '`type: UPLOAD` — answered with `error: not_implemented`; use `EXTERNAL_LINK`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /videos/{videoId}:
    delete:
      tags: [Videos]
      summary: Delete video (applicant only)
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Video deleted
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `APPLICANT`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'
        '404':
          description: No video with this id, or it isn't on the caller's own profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  $ref: '#/components/examples/VideoNotFound'

  # ==========================================================================
  # CERTIFICATION (Domain C)
  # ==========================================================================

  /certification/questions:
    get:
      tags: [Certification]
      summary: Get active certification questions (public, no scoring data)
      security: []
      responses:
        '200':
          description: List of questions, without points/weight/maxPoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificationQuestionPublic'

  /admin/certification/questions:
    get:
      tags: [Certification, Administration]
      summary: Get all certification questions, including inactive ones (admin only)
      responses:
        '200':
          description: Full list of questions with scoring data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificationQuestion'

    post:
      tags: [Certification, Administration]
      summary: Create certification question (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: integer
                type:
                  type: string
                  enum: [MULTIPLE_CHOICE, SHORT_TEXT, CHECKBOX, LIKERT_SCALE]
                text:
                  type: string
                description:
                  type: string
                weight:
                  type: integer
                  default: 1
                maxPoints:
                  type: integer
                  default: 10
                options:
                  type: array
                  description: Required (min 2) when type is MULTIPLE_CHOICE or CHECKBOX
                  items:
                    type: object
                    properties:
                      text:
                        type: string
                      points:
                        type: integer
                      order:
                        type: integer
                    required: [text, points, order]
              required: [order, type, text]
      responses:
        '201':
          description: Question created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationQuestion'
        '400':
          description: Validation error (including a choice question with fewer than 2 options)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/certification/questions/{id}:
    patch:
      tags: [Certification, Administration]
      summary: Update a certification question, its weight, or its options (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: All fields optional. Sending `options` replaces the full option set.
              properties:
                order:
                  type: integer
                type:
                  type: string
                  enum: [MULTIPLE_CHOICE, SHORT_TEXT, CHECKBOX, LIKERT_SCALE]
                text:
                  type: string
                description:
                  type: string
                weight:
                  type: integer
                maxPoints:
                  type: integer
                isActive:
                  type: boolean
                options:
                  type: array
                  items:
                    type: object
                    properties:
                      text:
                        type: string
                      points:
                        type: integer
                      order:
                        type: integer
                    required: [text, points, order]
      responses:
        '200':
          description: Question updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationQuestion'
        '400':
          description: The patch body itself is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Question not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Cannot replace options for a question that already has recorded answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            The patch is well formed but its effective result breaks a rule —
            a MULTIPLE_CHOICE or CHECKBOX question left with fewer than 2
            options, checked against the type already stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /certification/attempt:
    post:
      tags: [Certification]
      summary: Start or resume the caller's certification attempt (applicant only)
      description: >-
        At most one IN_PROGRESS attempt exists per user. If one is already
        open, it is returned as-is (200) instead of creating a new one (201)
        — this is what makes save/resume work.
      responses:
        '200':
          description: An IN_PROGRESS attempt already existed and was returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationAttempt'
        '201':
          description: A new attempt was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationAttempt'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated user is not an APPLICANT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /certification/attempt/{attemptId}:
    get:
      tags: [Certification]
      summary: Get a certification attempt (applicant only, own attempt)
      description: >-
        While the attempt is IN_PROGRESS, each answer's `pointsEarned` is
        omitted — scoring is never revealed before submission.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attempt details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationAttempt'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: This attempt does not belong to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Attempt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /certification/attempt/{attemptId}/answer:
    post:
      tags: [Certification]
      summary: Save an answer to one question of an in-progress attempt (applicant only)
      description: >-
        Re-submitting an answer for the same question REPLACES it, it never
        accumulates. Exactly one of optionId / optionIds / textAnswer /
        numericAnswer is required, matching the question's real type in the
        database — the client's intent is validated against that, not
        trusted at face value. `pointsEarned` is never included in the
        response; scoring is computed only on /submit.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                questionId:
                  type: string
                optionId:
                  type: string
                  description: Required for MULTIPLE_CHOICE questions
                optionIds:
                  type: array
                  items:
                    type: string
                  description: Required for CHECKBOX questions (one or more selected options)
                textAnswer:
                  type: string
                  description: Required for SHORT_TEXT questions
                numericAnswer:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Required for LIKERT_SCALE questions (1 to 5)
              required: [questionId]
      responses:
        '201':
          description: >-
            The saved answer(s) — an array with one item, except for
            CHECKBOX questions which return one item per selected option
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Answer'
        '400':
          description: >-
            The body itself is invalid — malformed JSON, missing questionId, or
            a numericAnswer outside 1..5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: This attempt does not belong to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Attempt or question not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The attempt is no longer IN_PROGRESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            The body is well formed but does not fit the question's real type —
            the required field for that type is missing, or an optionId belongs
            to another question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /certification/attempt/{attemptId}/submit:
    post:
      tags: [Certification]
      summary: Score and close an in-progress attempt (applicant only)
      description: >-
        Computes the final score, resolves the badge tier, writes both onto
        the applicant's Profile, and sends a notification if a badge tier
        was actually earned (the lowest tier has no badge). Idempotent in
        the sense that submitting an already-COMPLETED attempt is rejected
        (409) rather than recomputing — the recorded score never changes
        after the fact.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attempt scored and closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationSubmitResult'
        '403':
          description: This attempt does not belong to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Attempt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The attempt is not IN_PROGRESS (already submitted, abandoned, or expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # RECRUITER SPACE & INTERACTIONS (Domain D)
  # ==========================================================================

  /recruiter/catalogue:
    get:
      tags: [Recruiter]
      summary: Browse the applicant catalogue (recruiter/admin only)
      description: >
        Paginated, filtered list of job-seeker profiles. Profiles rejected by
        moderation and profiles owned by a deactivated account are never
        returned; profiles still awaiting review are, so that a moderation
        backlog does not hide job-seekers from recruiters.
        Rows deliberately carry no email address — a recruiter reaches an
        applicant through `POST /interactions`, which keeps the contact
        auditable and notifies the applicant.


        Ordering is total: every `sort` value ends on the profile id, so no two
        rows compare equal and a walk over an unchanging data set yields the
        same sequence every time. What that does *not* buy is a snapshot across
        pages — a profile written between two page requests moves within the
        order and can be seen twice or skipped. See
        docs/livrables/note-algorithme-de-classement.md.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: q
          in: query
          description: >-
            Free-text search over headline, bio, sector, location and skills.
            Deliberately not over the candidate's first or last name — see
            docs/livrables/note-criteres-de-filtrage.md.
          schema:
            type: string
            maxLength: 100
        - name: sector
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: skills
          in: query
          description: >
            Skill names, repeated or comma-separated. A profile must carry
            every requested skill, not just one of them.
          schema:
            type: array
            maxItems: 10
            items:
              type: string
          style: form
          explode: true
        - name: certifiedOnly
          in: query
          schema:
            type: boolean
        - name: minScore
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: hasVideo
          in: query
          schema:
            type: boolean
        - name: availability
          in: query
          description: >-
            Exact match on the availability the candidate declared. A profile
            that declared none never matches, whichever value is asked for.
          schema:
            type: string
            enum: [IMMEDIATE, WITHIN_ONE_MONTH, WITHIN_THREE_MONTHS, LATER]
        - name: favoritesOnly
          in: query
          description: Restricts the result to the caller's shortlist.
          schema:
            type: boolean
        - name: sort
          in: query
          description: >-
            Ordering, drawn from professional criteria only, one per criterion
            named in the 8 September letter: date (`recent`), certification
            status (`certification`) and score (`score`), declared sector,
            declared location, declared availability. Every ordering ends on
            the profile id, so it is total and two walks of the catalogue
            return the same sequence. `name` was withdrawn on 2026-09-08; see
            docs/livrables/note-algorithme-de-classement.md.
          schema:
            type: string
            enum: [recent, certification, score, sector, location, availability]
            default: recent
      responses:
        '200':
          description: A page of catalogue profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueProfilePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /recruiter/catalogue/facets:
    get:
      tags: [Recruiter]
      summary: List filter values that match at least one visible profile
      description: >
        Lets the catalogue UI offer only filters that return results. Counts
        follow the same visibility rules as the catalogue itself.
      responses:
        '200':
          description: Available filter values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueFacets'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /recruiter/favorites:
    get:
      tags: [Recruiter]
      summary: List the caller's shortlisted applicants
      description: The catalogue narrowed to favourites; accepts the same filters.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: sort
          in: query
          description: Same ordering vocabulary as `GET /recruiter/catalogue`.
          schema:
            type: string
            enum: [recent, certification, score, sector, location, availability]
            default: recent
      responses:
        '200':
          description: A page of shortlisted profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueProfilePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /recruiter/favorites/{applicantId}:
    put:
      tags: [Recruiter]
      summary: Add an applicant to the caller's shortlist (idempotent)
      parameters:
        - name: applicantId
          in: path
          required: true
          description: User id of the applicant, not the profile id.
          schema:
            type: string
      responses:
        '200':
          description: The applicant was already shortlisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '201':
          description: The applicant was added to the shortlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Recruiter]
      summary: Remove an applicant from the caller's shortlist (idempotent)
      description: >
        Clears the favourite flag and keeps the interaction row, so the
        history of who was shortlisted stays auditable.
      parameters:
        - name: applicantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The applicant is not shortlisted any more
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /recruiter/dashboard:
    get:
      tags: [Recruiter]
      summary: Activity summary for the calling recruiter
      responses:
        '200':
          description: Recruiter dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /interactions:
    get:
      tags: [Interactions]
      summary: List my interactions
      description: >
        Defaults to what the caller sent, or to what they received when the
        caller is a job-seeker; `direction` overrides that.
      parameters:
        - name: direction
          in: query
          schema:
            type: string
            enum: [sent, received]
        - name: type
          in: query
          schema:
            type: string
            enum: [VIEW, CONTACT, FAVORITE, MESSAGE]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A page of interactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Interactions]
      summary: Record an interaction with an applicant (recruiter/admin)
      description: >
        `message` is required for CONTACT and MESSAGE and rejected for the
        other types. A repeated VIEW within 24h collapses onto the existing
        one and answers 200 instead of 201. Only CONTACT and MESSAGE notify
        the applicant, and they are capped at 5 per applicant per 24h.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipientId:
                  type: string
                  description: User id of the applicant.
                type:
                  type: string
                  enum: [VIEW, CONTACT, FAVORITE, MESSAGE]
                message:
                  type: string
                  minLength: 10
                  maxLength: 2000
              required: [recipientId, type]
      responses:
        '200':
          description: An equivalent interaction already existed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '201':
          description: Interaction recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /interactions/{interactionId}:
    patch:
      tags: [Interactions]
      summary: Update an interaction flag
      description: >
        `isViewed` may only be written by the applicant who received the
        interaction, `isFavorite` only by the recruiter who created it.
      parameters:
        - name: interactionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                isViewed:
                  type: boolean
                isFavorite:
                  type: boolean
      responses:
        '200':
          description: Interaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================================
  # NOTIFICATIONS (Domain A)
  # ==========================================================================

  /notifications:
    get:
      tags: [Notifications]
      summary: List my notifications
      description: >
        Newest first, paginated like every other list. `unread` is returned
        alongside the page so a badge count does not cost a second request.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A page of notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/NotificationPage'
                  - type: object
                    properties:
                      unread:
                        type: integer
                        description: Total unread notifications, not just on this page.
                    required: [unread]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Mark one of my notifications as read
      description: >
        Answers 404 for a notification belonging to someone else, so the route
        cannot be used to discover that one exists.
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================================
  # ADMINISTRATION
  # ==========================================================================

  /admin/dashboard:
    get:
      tags: [Administration]
      summary: Platform-wide statistics (admin only)
      responses:
        '200':
          description: Administration dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/moderation/videos:
    get:
      tags: [Administration]
      summary: Videos awaiting an administrator's decision (admin only)
      description: >-
        The queue behind the *a priori* moderation the addendum of 2 September
        requires (§7.9.2). No video reaches a recruiter or the public before it
        is approved here.

        This is the one response that carries the address of a video that is not
        published: an administrator cannot decide on a video without watching
        it. The route is admin-only, and every other surface — catalogue, feed,
        public profile — filters on APPROVED.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          description: Defaults to PENDING, the queue itself.
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, ALL]
            default: PENDING
      responses:
        '200':
          description: A page of videos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VideoModerationItem'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, pagination]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/videos/{videoId}/moderate:
    post:
      tags: [Administration]
      summary: Approve or reject a video, with a recorded reason (admin only)
      description: >-
        Writes the decision and a ModerationLog row naming who decided and when.
        The reason is mandatory in both directions — a rejected video whose
        author is told nothing is, in the legal adviser's words, litigation
        starting — and it is surfaced to the candidate in their own space.
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT]
                reason:
                  type: string
                  minLength: 10
                  maxLength: 500
                  description: Shown to the candidate. Required for both actions.
                notes:
                  type: string
                  description: Internal, never shown to the candidate.
              required: [action, reason]
      responses:
        '200':
          description: The video with its new status and the decision that set it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoModerationItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /admin/moderation/profiles:
    get:
      tags: [Administration]
      summary: Get profiles pending moderation (admin only)
      description: >-
        The review queue, oldest-submitted-first (the opposite order from
        the public feed) so nothing gets pushed down by newer submissions.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 20
      responses:
        '200':
          description: Paginated list of `PENDING` profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `ADMIN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'

  /admin/profiles/{profileId}/moderate:
    post:
      tags: [Administration]
      summary: Moderate a profile (admin only)
      description: >-
        Atomically updates `Profile.moderationStatus` and appends a
        `ModerationLog` row — see that model's mapping from `action` to the
        resulting status in `moderation.service.ts` (`REQUIRE_CHANGES` and
        `REJECT` both resolve to `REJECTED`; the distinction is preserved in
        the log's `action`, not in the status field itself).
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT, FLAG, REQUIRE_CHANGES]
                reason:
                  type: string
                  maxLength: 500
                notes:
                  type: string
                  maxLength: 2000
              required: [action]
      responses:
        '200':
          description: Profile moderated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Missing/invalid `action`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  $ref: '#/components/examples/ValidationError'
        '401':
          description: No token, or an invalid/expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  $ref: '#/components/examples/Unauthorized'
        '403':
          description: Authenticated, but not as an `ADMIN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  $ref: '#/components/examples/ForbiddenRole'
        '404':
          description: No profile with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  $ref: '#/components/examples/ProfileNotFound'
