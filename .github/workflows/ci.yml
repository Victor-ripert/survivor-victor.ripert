name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      JWT_SECRET: ci-test-jwt-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate:prod -w @profils-actifs/db

      - name: Seed database
        run: npm run db:seed -w @profils-actifs/db

      - name: Build all packages
        run: npm run build

      - name: Run linting
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test -- -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./packages/*/coverage/coverage-final.json
          fail_ci_if_error: false

      # Everything above (migrations, seed, build, lint, format, tests) must
      # succeed for this step to even run — a broken build never produces an
      # artifact, so a green workflow is the guarantee Thomas asked for.
      # Scoped to pushes on main only: PRs don't need a demo-ready artifact.
      - name: Package build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tar -czf build-artifact.tar.gz \
            packages/api/dist \
            packages/web/dist \
            packages/shared/dist \
            packages/db/prisma \
            package.json \
            package-lock.json

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: profils-actifs-build-${{ github.sha }}
          path: build-artifact.tar.gz
          retention-days: 14